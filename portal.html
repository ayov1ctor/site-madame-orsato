<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Portal de Destinos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            font-size: 2.5rem;
            font-style: italic;
            text-align: center;
            margin-bottom: 50px;
            color: #faedcd;
            text-shadow: 0 0 15px rgba(250, 237, 205, 0.3);
            letter-spacing: 2px;
        }
        .portal-container {
            display: flex;
            gap: 40px;
            width: 900px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .portal-card {
            flex: 1;
            height: 350px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .games-portal {
            background: rgba(0, 229, 255, 0.03);
            border: 2px solid #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }
        .games-portal:hover {
            transform: translateY(-10px);
            background: rgba(0, 229, 255, 0.08);
            box-shadow: 0 15px 30px rgba(0, 229, 255, 0.3);
        }
        .games-portal h2 {
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
            font-family: monospace;
            font-size: 1.8rem;
        }
        .literary-portal {
            background: rgba(212, 163, 115, 0.05);
            border: 2px solid #d4a373;
            box-shadow: 0 0 15px rgba(212, 163, 115, 0.1);
        }
        .literary-portal:hover {
            transform: translateY(-10px);
            background: rgba(212, 163, 115, 0.12);
            box-shadow: 0 15px 30px rgba(212, 163, 115, 0.3);
        }
        .literary-portal h2 {
            color: #faedcd;
            text-shadow: 0 0 10px rgba(250, 237, 205, 0.4);
            font-size: 1.8rem;
            font-style: italic;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #b7b7a4;
            margin-top: 15px;
        }
        @media (max-width: 768px) {
            body { height: auto; padding: 40px 0; }
            .portal-container { flex-direction: column; width: 100%; gap: 20px; }
            .portal-card { height: 280px; }
        }
    </style>
</head>
<body>

    <h1>Escolha o seu destino</h1>

    <div class="portal-container">
        
        <a href="jogos.html" class="portal-card games-portal">
            <h2>👾 Salão de Jogos</h2>
            <p>Entre no labirinto de enigmas, desafie a Rainha de Copas e decifre os mistérios lógicos escondidos em cada fase.</p>
        </a>

        <a href="escritorio.html" class="portal-card literary-portal">
            <h2>🖋️ Espaço Literário</h2>
            <p>Um refúgio calmo. Escreva poemas e eternize suas histórias na estante.</p>
        </a>

    </div>

</body>
</html>
